<!DOCTYPE html>
<html>
<head>
    <title>Module Picker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="content">
        <h1>Select a Module</h1>
        <div class="year-nav">
            <a href="/?last_year=0">New arrival / finished school</a>
            <a href="/?last_year=1">I finished Year 1</a>
            <a href="/?last_year=2">I finished Year 2</a>
            <a href="/?last_year=3">I finished Year 3</a>
            <a href="/?last_year=4">I finished Year 4</a>
            <a href="/?last_year=5">All</a>
        </div>
        <ul>
            <form method="get" action="/check">
                <input type="hidden" name="last_year" value="{{ last_year }}">
                <label><input type="radio" name="exam_percent" value=""> Any assessment type</label>
                <label><input type="radio" name="exam_percent" value="0"> 100% coursework</label>
                <label><input type="radio" name="exam_percent" value="60"> 60% exam / 40% coursework</label>
                <label><input type="radio" name="exam_percent" value="80"> 80% exam / 20% coursework</label>
                {% for code, details in modules.items() %}
                    <input type="checkbox" name="passed" value="{{code}}"> {{code}} - {{details.name}}<br>
                {% endfor %}        
                <button type="submit">Check eligibility</button>
            </form>
        </ul>
    </div>
</body>
</html>
