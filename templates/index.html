<!DOCTYPE html>
<html>
<head>
    <title>Module Picker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="content">
        <h1>Select a Module</h1>
        <div class="year-nav">
            <a href="/?last_year=0">New arrival / finished school</a>
            <a href="/?last_year=1">I finished Year 1</a>
            <a href="/?last_year=2">I finished Year 2</a>
            <a href="/?last_year=3">I finished Year 3</a>
            <a href="/?last_year=4">I finished Year 4</a>
            <a href="/?last_year=5">All</a>
        </div>
        <ul>
            <form method="get" action="/check">
                <input type="hidden" name="last_year" value="{{ last_year }}">
                <select name="exam_percent" onchange="window.location.href='/?last_year={{ last_year }}&exam_percent=' + this.value">
                    <option value="" {% if not exam_percent %}selected{% endif %}>Any assessment type</option>
                    <option value="0" {% if exam_percent == 0 %}selected{% endif %}>100% coursework</option>
                    <option value="60" {% if exam_percent == 60 %}selected{% endif %}>60% exam / 40% coursework</option>
                    <option value="80" {% if exam_percent == 80 %}selected{% endif %}>80% exam / 20% coursework</option>
                </select>
                {% if exam_percent != 0 %}
                <select name="exam_duration" onchange="window.location.href='/?last_year={{ last_year }}&exam_percent={{ exam_percent }}&exam_duration=' + this.value">
                    <option value="" {% if not exam_duration %}selected{% endif %}>Any duration</option>
                    <option value="2" {% if exam_duration == 2 %}selected{% endif %}>2 hours</option>
                    <option value="2.5" {% if exam_duration == 2.5 %}selected{% endif %}>2.5 hours</option>
                    <option value="3" {% if exam_duration == 3 %}selected{% endif %}>3 hours</option>
                </select>
                {% endif %}
                {% for code, details in modules.items() %}
                    <input type="checkbox" name="passed" value="{{code}}"> {{code}} - {{details.name}}<br>
                {% endfor %}        
                <button type="submit">Check eligibility</button>
            </form>
        </ul>
    </div>
</body>
</html>
