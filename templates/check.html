<!DOCTYPE html>
<html>
<head>
    <title>Eligibility Check</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body>
    <h1>Eligibility Check Results</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Module Code</th>
                <th>Module Name</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for code, status in results.items() %}
            <tr>
                <td>{{code}}</td>
                <td>{{modules[code].name}}</td>
                <td class="status-{{status}}">
                    {% if status=="eligible" %}
                        Eligible
                    {% elif status=="not_eligible" %}
                        Not Eligible
                    {% elif status=="unclear" %}
                        Unclear
                    {% else %}
                        Unknown
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
