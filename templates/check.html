<!DOCTYPE html>
<html>
<head>
    <title>Eligibility Check</title>
</head>
<body>
    <h1>Eligibility Check Results</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Module Code</th>
                <th>Module Name</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for code, status in results.items() %}
            <tr>
                <td>{{code}}</td>
                <td>{{modules[code].name}}</td>
                <td>{{"Eligible" if status else "Not Eligible"}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
